<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container" data-bind-bg-image="content.background_image">
        <div class="overlay"></div>
        <main class="content-wrapper">
            <h1 class="main-text" data-bind-text="content.main_text"></h1>
            <p class="subtitle-text" data-bind-text="content.subtitle_text"></p>

            <div class="clock-section">
                <div class="time-display" data-bind-show="app_settings.show_clock">
                    <span class="time" id="time-text"></span>
                </div>
                <div class="date-display" data-bind-show="app_settings.show_date">
                    <span class="date" id="date-text"></span>
                </div>
                <div class="timezone-display">
                    <span class="timezone" data-bind-text="app_settings.timezone"></span>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
